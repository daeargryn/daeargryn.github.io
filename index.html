<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I miei tool</title>
<meta name="theme-color" content="#0d6b63">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201f; --muted:#5d6b69; --line:#d6dddb;
  --accent:#0d6b63; --accent-soft:#dcefec;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1515; --surface:#172020; --fg:#e6eeec; --muted:#93a3a0; --line:#2a3735;
  --accent:#4fbfb2; --accent-soft:#16312e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1515; --surface:#172020; --fg:#e6eeec; --muted:#93a3a0; --line:#2a3735;
  --accent:#4fbfb2; --accent-soft:#16312e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
#today{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tool{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px;color:inherit;text-decoration:none;min-height:84px}
.tool:hover{border-color:var(--accent)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{flex-shrink:0;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.tool b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.tool span{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>I miei tool</h1>
    <p class="sub" id="today"></p>
  </header>

  <!-- Per aggiungere un tool: crea una cartella (es. /meteo/index.html) e copia un blocco <a class="tool"> qui sotto. -->
  <nav class="grid" aria-label="Tool">
    <a class="tool" href="bus/">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-2M16 21v-2M7.5 14.5h.01M16.5 14.5h.01M8 6.5h8"/><path d="M6 17h12v2H6z"/>
        </svg>
      </span>
      <div><b>Bus</b><span>Linee 136 · 138 · 157 · Cosenza – Rende – Unical</span></div>
    </a>
  </nav>

  <footer>Uso personale.</footer>
</div>
<script>
try{document.getElementById("today").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase())}catch(e){}
</script>
</body>
</html>
